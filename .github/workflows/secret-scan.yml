# gitleaks で、API キー・トークン・パスワードなどの秘密情報がコミットに入っていないかを、履歴ごと調べる。
# GitHub 標準の秘密情報チェック（Settings → Code security）は、主要なサービスのキーの形を見る。
# gitleaks はそれより広い形（汎用のキーなど）も見るので、両方を重ねる。
# 見つかったらジョブが失敗し、実行結果のページに場所が出る。
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # 毎週月曜 12:27（日本時間）。新しいルールで履歴を見直す
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 履歴を全部取る（過去のコミットに入ったものも見つけるため）
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3 # gitleaks 本体の版も固定する
          GITLEAKS_ENABLE_COMMENTS: false # PR にコメントしない（書き込みの権限を渡さないため）
          # 個人アカウントのリポジトリなので GITLEAKS_LICENSE は要らない
